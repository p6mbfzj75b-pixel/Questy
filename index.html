<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>QUESTY</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#4D71B5">

<link rel="apple-touch-icon" href="icon-192.png">


<style>

/* =========================================================
   QUESTY
   PIXEL / ARCADE THEME
========================================================= */

:root {

  --bg: #101827;
  --card: #19253a;
  --card-light: #223352;

  --border: #4D71B5;
  --border-dark: #304b7d;

  --text: #f8f9ff;
  --muted: #9daecc;

  --blue: #4D71B5;
  --blue-light: #7092d3;

  --yellow: #FFC94C;
  --yellow-dark: #dca72c;

  --red: #ef5b5b;
  --green: #55d68b;

  --shadow:
    5px 5px 0px #0a101c;

  --pixel-font:
    "Courier New",
    monospace;
}


/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}


html {
  background: var(--bg);
}


body {

  margin: 0;

  min-height: 100vh;

  font-family:
    "Courier New",
    monospace;

  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(77,113,181,.18),
      transparent 30%
    ),

    radial-gradient(
      circle at 85% 80%,
      rgba(255,201,76,.08),
      transparent 30%
    ),

    var(--bg);

  color: var(--text);

}


/* =========================================================
   APP
========================================================= */

.app {

  width: 100%;
  max-width: 760px;

  margin: auto;

  padding: 20px;

}


/* =========================================================
   HEADER
========================================================= */

header {

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  gap: 25px;

  margin-bottom: 30px;

}


.logo {

  font-family:
    "Courier New",
    monospace;

  font-size: 32px;

  font-weight: 900;

  letter-spacing: 3px;

  color: var(--yellow);

  text-shadow:
    3px 3px 0 #000;

}


.logo span {

  color: var(--blue-light);

}


.subtitle {

  margin-top: 5px;

  color: var(--muted);

  font-size: 11px;

  letter-spacing: 1px;

}


/* =========================================================
   LEVEL
========================================================= */

.level-box {

  min-width: 180px;

  text-align: right;

  font-size: 12px;

  font-weight: bold;

}


.level-number {

  color: var(--yellow);

  font-size: 18px;

}


.xp-bar {

  height: 14px;

  margin:
    7px 0;

  padding: 2px;

  background: #0a101c;

  border:
    2px solid var(--border);

}


#xp-fill {

  height: 100%;

  width: 0%;

  background:
    linear-gradient(
      90deg,
      var(--blue),
      var(--yellow)
    );

  transition:
    width .4s ease;

}


/* =========================================================
   CARDS
========================================================= */

.card {

  background:
    linear-gradient(
      145deg,
      var(--card),
      #152136
    );

  border:
    2px solid var(--border);

  padding: 20px;

  margin-bottom: 20px;

  box-shadow:
    var(--shadow);

  position: relative;

}


.card::before {

  content: "";

  position: absolute;

  top: -2px;
  left: 12px;

  width: 45px;
  height: 4px;

  background:
    var(--yellow);

}


h1,
h2 {

  margin-top: 0;

}


h1 {

  font-size: 23px;

  color: var(--yellow);

}


h2 {

  font-size: 18px;

}


p {

  color: var(--muted);

  font-size: 13px;

  line-height: 1.5;

}


/* =========================================================
   INPUTS
========================================================= */

input,
select {

  width: 100%;

  padding: 14px;

  border:
    2px solid var(--border-dark);

  background:
    #0d1524;

  color:
    var(--text);

  font-family:
    inherit;

  font-size:
    14px;

  outline:
    none;

}


input:focus,
select:focus {

  border-color:
    var(--yellow);

  box-shadow:
    0 0 0 2px
    rgba(255,201,76,.15);

}


input::placeholder {

  color:
    #687794;

}


.options {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    12px;

  margin:
    16px 0;

}


label {

  display:
    block;

  color:
    var(--muted);

  font-size:
    10px;

  margin-bottom:
    6px;

  text-transform:
    uppercase;

  letter-spacing:
    1px;

}


/* =========================================================
   BUTTONS
========================================================= */

button {

  border:
    none;

  padding:
    13px 16px;

  font-family:
    inherit;

  font-size:
    12px;

  font-weight:
    900;

  cursor:
    pointer;

  transition:
    transform .1s ease,
    filter .1s ease;

}


button:hover {

  filter:
    brightness(1.12);

}


button:active {

  transform:
    translate(
      3px,
      3px
    );

}


.primary {

  width:
    100%;

  background:
    var(--yellow);

  color:
    #17120a;

  box-shadow:
    4px 4px 0
    #9d7621;

}


.secondary {

  width:
    100%;

  margin-top:
    10px;

  background:
    var(--blue);

  color:
    white;

  box-shadow:
    4px 4px 0
    #263d68;

}


.random-button {

  width:
    100%;

  margin-top:
    15px;

  background:
    var(--blue);

  color:
    white;

  box-shadow:
    4px 4px 0
    #263d68;

}


.accept-random {

  width:
    100%;

  margin-top:
    12px;

  background:
    var(--green);

  color:
    #08140d;

  box-shadow:
    4px 4px 0
    #32865a;

}


.accept-print {

  width:
    100%;

  margin-top:
    8px;

  background:
    var(--yellow);

  color:
    #17120a;

  box-shadow:
    4px 4px 0
    #9d7621;

}


.print-button {

  background:
    var(--blue);

  color:
    white;

  padding:
    9px 11px;

  font-size:
    11px;

  box-shadow:
    3px 3px 0
    #263d68;

}


.complete {

  background:
    var(--green);

  color:
    #08140d;

  font-size:
    18px;

  width:
    42px;

  height:
    42px;

  padding:
    0;

}


.delete {

  background:
    transparent;

  color:
    #7885a0;

  font-size:
    16px;

  padding:
    8px;

}


/* =========================================================
   QUEST LIST
========================================================= */

.quest {

  background:
    var(--card);

  border:
    2px solid var(--border-dark);

  padding:
    14px;

  margin:
    10px 0;

  display:
    flex;

  align-items:
    center;

  gap:
    9px;

  box-shadow:
    3px 3px 0
    #0a101c;

}


.quest-info {

  flex:
    1;

  min-width:
    0;

}


.quest-name {

  font-weight:
    bold;

  font-size:
    14px;

  margin-bottom:
    6px;

  overflow-wrap:
    anywhere;

}


.quest-meta {

  font-size:
    10px;

  color:
    var(--muted);

}


.quest-type {

  display:
    inline-block;

  padding:
    2px 5px;

  margin-right:
    5px;

  border:
    1px solid
    var(--border);

  color:
    var(--yellow);

}


/* =========================================================
   RANDOM QUEST
========================================================= */

.random-result {

  min-height:
    100px;

  margin-top:
    15px;

  border:
    2px dashed
    var(--blue-light);

  background:
    #0d1524;

  display:
    flex;

  justify-content:
    center;

  align-items:
    center;

  text-align:
    center;

  padding:
    18px;

  font-size:
    17px;

  font-weight:
    bold;

  color:
    var(--yellow);

}


.random-buttons {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    10px;

  margin-top:
    10px;

}


.random-buttons button {

  width:
    100%;

}


/* =========================================================
   ACHIEVEMENTS
========================================================= */

.achievement {

  display:
    flex;

  align-items:
    center;

  gap:
    12px;

  padding:
    13px 0;

  border-bottom:
    1px solid
    var(--border-dark);

}


.achievement-icon {

  width:
    38px;

  height:
    38px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  background:
    #0d1524;

  border:
    2px solid
    var(--yellow);

  color:
    var(--yellow);

  font-size:
    18px;

}


.locked {

  opacity:
    .3;

  filter:
    grayscale(1);

}


/* =========================================================
   HISTORY
========================================================= */

.history-item {

  padding:
    11px 0;

  border-bottom:
    1px solid
    var(--border-dark);

  font-size:
    12px;

}


.history-xp {

  color:
    var(--yellow);

  font-weight:
    bold;

}


/* =========================================================
   EMPTY
========================================================= */

.empty {

  padding:
    25px;

  text-align:
    center;

  border:
    2px dashed
    var(--border-dark);

  color:
    var(--muted);

  font-size:
    12px;

}


/* =========================================================
   SVG ICONS
========================================================= */

.icon {

  width:
    22px;

  height:
    22px;

  vertical-align:
    middle;

  display:
    inline-block;

}


.icon svg {

  width:
    100%;

  height:
    100%;

  fill:
    currentColor;

}


/* =========================================================
   THEME
========================================================= */

.theme-grid {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    10px;

}


.theme-option {

  padding:
    12px;

  background:
    #0d1524;

  color:
    var(--text);

  border:
    2px solid
    var(--border-dark);

  text-align:
    left;

}


.theme-option.active {

  border-color:
    var(--yellow);

  color:
    var(--yellow);

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 550px) {

  .app {

    padding:
      14px;

  }


  header {

    flex-direction:
      column;

    align-items:
      flex-start;

  }


  .level-box {

    width:
      100%;

    text-align:
      left;

  }


  .options {

    grid-template-columns:
      1fr;

  }


  .random-buttons {

    grid-template-columns:
      1fr;

  }


  .quest {

    flex-wrap:
      wrap;

  }


  .quest-info {

    width:
      100%;

    flex-basis:
      100%;

  }

}


/* =========================================================
   OTHER THEMES
========================================================= */

body.theme-purple {

  --bg: #170f24;
  --card: #26163b;
  --border: #8c5ac7;
  --border-dark: #593b7c;
  --blue: #8c5ac7;
  --blue-light: #b58ae5;
  --yellow: #ffc94c;

}


body.theme-blue {

  --bg: #08151f;
  --card: #10283a;
  --border: #3d91bd;
  --border-dark: #285d7b;
  --blue: #3d91bd;
  --blue-light: #70c3eb;
  --yellow: #ffc94c;

}


body.theme-pink {

  --bg: #21121d;
  --card: #32202d;
  --border: #c96c9c;
  --border-dark: #77445f;
  --blue: #c96c9c;
  --blue-light: #ed91ba;
  --yellow: #ffc94c;

}


body.theme-green {

  --bg: #0b1912;
  --card: #15291e;
  --border: #4d9a69;
  --border-dark: #326445;
  --blue: #4d9a69;
  --blue-light: #7bc793;
  --yellow: #ffc94c;

}


body.theme-fire {

  --bg: #1d0d08;
  --card: #301711;
  --border: #d35b36;
  --border-dark: #803822;
  --blue: #d35b36;
  --blue-light: #f18b67;
  --yellow: #ffc94c;

}

</style>

</head>


<body class="theme-dark">


<div class="app">


<!-- =====================================================

<script>

/* =========================================================
   DATEN
========================================================= */

let data =
JSON.parse(
  localStorage.getItem("questMode")
) || {

  xp: 0,

  quests: [],

  history: [],

  randomQuests: [

    "10 Minuten spazieren gehen",

    "Eine Schublade aufräumen",

    "Ein Glas Wasser trinken",

    "5 Minuten dehnen",

    "Eine Sache erledigen, die ich seit Tagen aufschiebe"

  ],

  achievements: {}

};


/* =========================================================
   RANDOM QUEST
========================================================= */

let currentRandomQuest = null;


/* =========================================================
   SVG ICONS
========================================================= */

function icon(type) {

  const icons = {


    quest: `
      <svg viewBox="0 0 24 24">
        <path d="
          M13 2

    `,


    daily: `

    `,


    side: `

          H12
          Z
        "/>

    `,


    boss: `
      <svg viewBox="0 0 24 24">
        <path d="
          M5 21
          L3 7
          L8 10
          L12 3
          L16 10
          L21 7
          L19 21

        "/>
        <rect x="8" y="14" width="3" height="3"/>
        <rect x="13" y="14" width="3" height="3"/>
      </svg>
    `,


    check: `
      <svg viewBox="0 0 24 24">
        <path d="
          M3 12
          L8 17
          L21 4
          L21 10
          L8 22
          L3 17
          Z
        "/>
      </svg>
    `,


    trash: `
      <svg viewBox="0 0 24 24">
        <rect x="5" y="6" width="14" height="15"/>

    `,


    printer: `
      <svg viewBox="0 0 24 24">
        <path d="

          H21

        <rect x="8" y="14" width="8" height="5" fill="#101827"/>

        <rect x="6" y="10" width="3" height="2" fill="#FFC94C"/>
      </svg>
    `,


    trophy: `
      <svg viewBox="0 0 24 24">
        <path d="
          M6 3
          H18
          V10
          C18 15 15 17 12 17
          C9 17 6 15 6 10
          Z
        "/>
        <rect x="10" y="17" width="4" height="4"/>

    crystal: `

/* =========================================================
   ACHIEVEMENTS
========================================================= */

const achievements = [


  {

    id: "first",

    icon: "I",

    name: "ERSTE SCHRITTE",

    description:
      "Schließe deine erste Quest ab.",

    check: () =>
      data.history.length >= 1

  },


  {

    id: "five",

    icon: "V",

    name: "IM FLOW",

    description:
      "Schließe 5 Quests ab.",

    check: () =>
      data.history.length >= 5

  },


  {

    id: "ten",

    icon: "X",

    name: "QUEST HUNTER",

    description:
      "Schließe 10 Quests ab.",

    check: () =>
      data.history.length >= 10

  },


  {

    id: "hundred",

    icon: "XP",

    name: "HUNDERT PUNKTE",

    description:
      "Sammle 100 XP.",

    check: () =>
      data.xp >= 100

  },


  {

    id: "fivehundred",

    icon: "500",

    name: "QUESTMASTER",

    description:
      "Sammle 500 XP.",

    check: () =>
      data.xp >= 500

  },


  {

    id: "boss",

    icon: "B",

    name: "BOSS DOWN",

    description:
      "Schließe eine Hard Quest ab.",

    check: () =>
      data.history.some(
        q => q.type === "boss"
      )

  }

];


/* =========================================================
   SPEICHERN
========================================================= */

function save() {

  localStorage.setItem(
    "questMode",
    JSON.stringify(data)
  );

}


/* =========================================================
   XP
========================================================= */

function getXP(difficulty) {

  return {

    1: 10,

    2: 20,

    3: 35,

    4: 60

  }[difficulty] || 20;

}


/* =========================================================
   QUEST ERSTELLEN
========================================================= */

function addQuest() {

  const input =
    document.getElementById(
      "questInput"
    );


  const text =
    input.value.trim();


  if (!text) {

    alert(
      "Du brauchst erst eine Quest."
    );

    return;

  }


  const difficulty =
    Number(
      document
        .getElementById(
          "difficulty"
        )
        .value
    );


  const type =
    document
      .getElementById(
        "questType"
      )
      .value;


  data.quests.push({

    id:
      Date.now(),

    text:
      text,

    difficulty:
      difficulty,

    type:
      type,

    xp:
      getXP(difficulty),

    created:
      new Date()
        .toLocaleString(
          "de-DE"
        )

  });


  input.value = "";


  save();

  render();

}


/* =========================================================
   RANDOM QUEST
========================================================= */

function randomQuest() {

  if (
    data.randomQuests.length === 0
  ) {

    alert(
      "Du hast noch keine Random Quests."
    );

    return;

  }


  const index =

    Math.floor(
      Math.random() *
      data.randomQuests.length
    );


  currentRandomQuest =
    data.randomQuests[index];


  document.getElementById(
    "randomResult"
  ).innerHTML =

    currentRandomQuest;

}


/* =========================================================
   RANDOM QUEST ANNEHMEN
========================================================= */

function acceptRandomQuest(
  printAfter
) {

  if (
    currentRandomQuest === null
  ) {

    alert(
      "Würfle zuerst eine Random Quest."
    );

    return;

  }


  const quest = {

    id:
      Date.now(),

    text:
      currentRandomQuest,

    difficulty:
      2,

    type:
      "side",

    xp:
      20,

    created:
      new Date()
        .toLocaleString(
          "de-DE"
        )

  };


  data.quests.push(
    quest
  );


  currentRandomQuest = null;


  document.getElementById(
    "randomResult"
  ).innerHTML =

    "QUEST ANGENOMMEN";


  save();

  render();


  if (printAfter) {

    printQuest(
      quest
    );

  }

}


/* =========================================================
   RANDOM QUESTS VERWALTEN
========================================================= */

function manageRandomQuests() {

  let list =
    "DEINE RANDOM QUESTS\n\n";


  if (
    data.randomQuests.length === 0
  ) {

    list +=
      "Noch keine Random Quests.\n";

  }


  data.randomQuests.forEach(
    function(
      quest,
      index
    ) {

      list +=
        (index + 1) +
        ". " +
        quest +
        "\n";

    }
  );


  const newQuest =
    prompt(
      list +
      "\n\nNeue Random Quest hinzufügen:"
    );


  if (
    newQuest &&
    newQuest.trim()
  ) {

    data.randomQuests.push(
      newQuest.trim()
    );


    save();


    alert(
      "Random Quest hinzugefügt."
    );

  }

}


/* =========================================================
   QUEST ABSCHLIESSEN
========================================================= */

function completeQuest(id) {

  const index =
    data.quests.findIndex(
      function(quest) {

        return quest.id === id;

      }
    );


  if (
    index === -1
  ) {

    return;

  }


  const quest =
    data.quests[index];


  data.xp +=
    quest.xp;


  data.history.unshift({

    ...quest,

    completed:
      new Date()
        .toLocaleString(
          "de-DE"
        )

  });


  data.quests.splice(
    index,
    1
  );


  checkAchievements();


  save();

  render();


  alert(

    "QUEST ABGESCHLOSSEN\n\n" +

    "+" +
    quest.xp +
    " XP"

  );

}


/* =========================================================
   QUEST LÖSCHEN
========================================================= */

function deleteQuest(id) {

  data.quests =
    data.quests.filter(
      function(quest) {

        return quest.id !== id;

      }
    );


  save();

  render();

}


/* =========================================================
   ACHIEVEMENTS
========================================================= */

function checkAchievements() {

  achievements.forEach(
    function(
      achievement
    ) {

      if (

        achievement.check() &&

        !data.achievements[
          achievement.id
        ]

      ) {

        data.achievements[
          achievement.id
        ] = true;


        setTimeout(
          function() {

            alert(

              "ACHIEVEMENT FREIGESCHALTET\n\n" +

              achievement.name +

              "\n\n" +

              achievement.description

            );

          },
          100
        );

      }

    }
  );

}


/* =========================================================
   QUEST-TYP ICON
========================================================= */

function typeIcon(type) {

  return {

    normal:
      icon("quest"),

    daily:
      icon("daily"),

    side:
      icon("side"),

    boss:
      icon("boss")

  }[type] || icon("quest");

}


/* =========================================================
   QUEST DRUCKEN
========================================================= */

    );

  }

    "★".repeat(
      quest.difficulty
    );

/* =========================================================
   QUESTS RENDERN
========================================================= */

function renderQuests() {

  const container =
    document.getElementById(
      "questList"
    );


  document.getElementById(
    "questCount"
  ).textContent =
    data.quests.length;


  if (
    data.quests.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        KEINE OFFENEN QUESTS

      </div>

    `;

    return;

  }


  container.innerHTML =

    data.quests.map(
      function(quest) {

        return `

          <div class="quest">

            <div class="quest-info">

              <div class="quest-name">

                ${typeIcon(
                  quest.type
                )}

                ${quest.text}

              </div>


              <div class="quest-meta">

                <span class="quest-type">

                  ${quest.type.toUpperCase()}

                </span>

                ${"★".repeat(
                  quest.difficulty
                )}

                &nbsp;·&nbsp;

                <span
                  class="history-xp"
                >

                  +${quest.xp} XP

                </span>

              </div>

            </div>


            <button
              class="print-button"
              data-print="${quest.id}"
              title="Quest drucken"
            >

              ${icon("printer")}

            </button>


            <button
              class="complete"
              data-complete="${quest.id}"
              title="Quest abschließen"
            >

              ${icon("check")}

            </button>


            <button
              class="delete"
              data-delete="${quest.id}"
              title="Quest löschen"
            >

              ${icon("trash")}

            </button>

          </div>

        `;

      }
    ).join("");

}


/* =========================================================
   ACHIEVEMENTS RENDERN
========================================================= */

function renderAchievements() {

  const container =
    document.getElementById(
      "achievements"
    );


  container.innerHTML =

    achievements.map(
      function(
        achievement
      ) {

        const unlocked =
          data.achievements[
            achievement.id
          ];


        return `

          <div class="achievement
            ${unlocked ? "" : "locked"}"
          >

            <div class="achievement-icon">

              ${achievement.icon}

            </div>


            <div>

              <strong>

                ${achievement.name}

              </strong>


              <div class="quest-meta">

                ${achievement.description}

              </div>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =========================================================
   HISTORIE RENDERN
========================================================= */

function renderHistory() {

  const container =
    document.getElementById(
      "history"
    );


  if (
    data.history.length === 0
  ) {

    container.innerHTML =

      "<p>Noch keine abgeschlossenen Quests.</p>";

    return;

  }


  container.innerHTML =

    data.history
      .slice(0, 20)
      .map(
        function(quest) {

          return `

            <div class="history-item">

              ${icon("check")}

              ${quest.text}

              <span class="history-xp">

                +${quest.xp} XP

              </span>


              <br>


              <small>

                ${quest.completed}

              </small>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================================================
   GESAMT RENDERN
========================================================= */

function render() {

  const level =

    Math.floor(
      data.xp / 100
    ) + 1;


  const xpIntoLevel =

    data.xp % 100;


  document.getElementById(
    "level"
  ).textContent =
    level;


  document.getElementById(
    "xp-current"
  ).textContent =
    xpIntoLevel;


  document.getElementById(
    "xp-needed"
  ).textContent =
    100;


  document.getElementById(
    "xp-fill"
  ).style.width =
    xpIntoLevel + "%";


  renderQuests();

  renderAchievements();

  renderHistory();

}


/* =========================================================
   QUEST ERSTELLEN BUTTON
========================================================= */

document
  .getElementById(
    "addQuestButton"
  )
  .addEventListener(
    "click",
    addQuest
  );


/* =========================================================
   RANDOM BUTTON
========================================================= */

document
  .getElementById(
    "randomButton"
  )
  .addEventListener(
    "click",
    randomQuest
  );


/* =========================================================
   RANDOM ANNEHMEN
========================================================= */

document
  .getElementById(
    "acceptRandomButton"
  )
  .addEventListener(
    "click",
    function() {

      acceptRandomQuest(
        false
      );

    }
  );


/* =========================================================
   RANDOM ANNEHMEN + DRUCKEN
========================================================= */

document
  .getElementById(
    "acceptPrintRandomButton"
  )
  .addEventListener(
    "click",
    function() {

      acceptRandomQuest(
        true
      );

    }
  );


/* =========================================================
   RANDOM VERWALTEN
========================================================= */

document
  .getElementById(
    "manageRandomButton"
  )
  .addEventListener(
    "click",
    manageRandomQuests
  );


/* =========================================================
   QUEST LIST BUTTONS
========================================================= */

document
  .getElementById(
    "questList"
  )
  .addEventListener(
    "click",
    function(event) {


      const completeButton =
        event.target.closest(
          "[data-complete]"
        );


      if (
        completeButton
      ) {

        completeQuest(

          Number(
            completeButton
              .dataset
              .complete
          )

        );

        return;

      }


      const deleteButton =
        event.target.closest(
          "[data-delete]"
        );


      if (
        deleteButton
      ) {

        deleteQuest(

          Number(
            deleteButton
              .dataset
              .delete
          )

        );

        return;

      }


      const printButton =
        event.target.closest(
          "[data-print]"
        );


      if (
        printButton
      ) {

        const id =
          Number(
            printButton
              .dataset
              .print
          );


        const quest =
          data.quests.find(
            function(q) {

              return q.id === id;

            }
          );


        if (quest) {

          printQuest(
            quest
          );

        }

      }

    }
  );


/* =========================================================
   THEMES
========================================================= */

function changeTheme(theme) {

  document.body.className =
    "theme-" +
    theme;


  localStorage.setItem(
    "questModeTheme",
    theme
  );

}


const themeSelect =
  document.getElementById(
    "themeSelect"
  );


if (themeSelect) {

  themeSelect.addEventListener(
    "change",
    function() {

      changeTheme(
        this.value
      );

    }
  );

}


const savedTheme =
  localStorage.getItem(
    "questModeTheme"
  );


if (savedTheme) {

  changeTheme(
    savedTheme
  );


  if (themeSelect) {

    themeSelect.value =
      savedTheme;

  }

} else {

  changeTheme(
    "dark"
  );

}


/* =========================================================
   APP START
========================================================= */

render();


</script>

</body>

</html>
