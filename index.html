<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>QuestMode</title>


<style>

/* =========================
   GRUNDLAYOUT
========================= */

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background: #15151c;

  color: #f4f4f5;

}


.app {

  max-width: 700px;

  margin: auto;

  padding: 20px;

}


/* =========================
   HEADER
========================= */

header {

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  gap: 20px;

  margin-bottom: 25px;

}


.logo {

  font-size: 28px;

  font-weight: 900;

  letter-spacing: 2px;

}


.logo span {

  opacity: .5;

}


.subtitle {

  color: #888894;

  font-size: 13px;

}


.level-box {

  min-width: 150px;

  text-align: right;

  font-size: 12px;

}


.xp-bar {

  height: 8px;

  background: #30303a;

  border-radius: 20px;

  margin: 5px 0;

  overflow: hidden;

}


#xp-fill {

  height: 100%;

  width: 0%;

  background: white;

  transition:
    width .4s ease;

}


/* =========================
   CARDS
========================= */

.card {

  background: #202029;

  border:
    1px solid #32323e;

  border-radius: 18px;

  padding: 20px;

  margin-bottom: 18px;

}


/* =========================
   INPUTS
========================= */

input,
select {

  width: 100%;

  padding: 14px;

  border-radius: 12px;

  border:
    1px solid #3b3b48;

  background: #15151c;

  color: white;

  font-size: 15px;

}


.options {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 12px;

  margin: 15px 0;

}


label {

  display: block;

  color: #9999a5;

  font-size: 12px;

  margin-bottom: 6px;

}


/* =========================
   BUTTONS
========================= */

button {

  border: none;

  border-radius: 12px;

  padding: 13px 16px;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

}


.primary {

  width: 100%;

  background: white;

  color: #111;

}


.secondary {

  width: 100%;

  margin-top: 10px;

  background: #30303b;

  color: white;

}


.random-button {

  width: 100%;

  background: white;

  color: #111;

  margin-top: 15px;

}


/* =========================
   QUESTS
========================= */

.quest {

  background: #202029;

  border:
    1px solid #32323e;

  border-radius: 15px;

  padding: 15px;

  margin: 10px 0;

  display: flex;

  align-items: center;

  gap: 10px;

}


.quest-info {

  flex: 1;

}


.quest-name {

  font-weight: bold;

  margin-bottom: 5px;

}


.quest-meta {

  font-size: 12px;

  color: #888894;

}


.complete {

  background: white;

  color: #111;

}


.delete {

  background: transparent;

  color: #777783;

}


/* =========================
   RANDOM QUEST
========================= */

.random-result {

  min-height: 90px;

  margin-top: 15px;

  border:
    2px dashed #454552;

  border-radius: 14px;

  display: flex;

  justify-content:
    center;

  align-items:
    center;

  text-align: center;

  padding: 15px;

  font-size: 20px;

  font-weight: bold;

}


.accept-random {

  width: 100%;

  margin-top: 10px;

  background: #ffffff;

  color: #111111;

}


/* =========================
   ACHIEVEMENTS
========================= */

.achievement {

  display: flex;

  align-items: center;

  gap: 12px;

  padding: 12px 0;

  border-bottom:
    1px solid #30303b;

}


.achievement-icon {

  font-size: 28px;

}


.locked {

  opacity: .35;

}


/* =========================
   HISTORIE
========================= */

.history-item {

  padding: 10px 0;

  border-bottom:
    1px solid #30303b;

  font-size: 13px;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 550px) {

  header {

    flex-direction:
      column;

    align-items:
      flex-start;

  }


  .level-box {

    width: 100%;

    text-align: left;

  }


  .options {

    grid-template-columns:
      1fr;

  }

}

</style>

</head>


<body>


<div class="app">


<!-- =========================
     HEADER
========================= -->

<header>

  <div>

    <div class="logo">

      QUEST<span>MODE</span>

    </div>


    <div class="subtitle">

      Dein Leben. Deine Quests.

    </div>

  </div>


  <div class="level-box">

    <div>

      LEVEL
      <span id="level">
        1
      </span>

    </div>


    <div class="xp-bar">

      <div id="xp-fill"></div>

    </div>


    <small>

      <span id="xp-current">
        0
      </span>

      /

      <span id="xp-needed">
        100
      </span>

      XP

    </small>

  </div>

</header>



<!-- =========================
     QUEST ERSTELLEN
========================= -->

<div class="card">

  <h1>
    ⚔️ Was steht heute an?
  </h1>


  <p>
    Mach aus einer Aufgabe eine Quest.
  </p>


  <br>


  <input
    id="questInput"
    type="text"
    placeholder="z.B. Küche aufräumen..."
  >


  <div class="options">


    <div>

      <label>
        Schwierigkeit
      </label>


      <select id="difficulty">

        <option value="1">
          ⭐ Easy
        </option>

        <option value="2">
          ⭐⭐ Normal
        </option>

        <option value="3">
          ⭐⭐⭐ Schwer
        </option>

        <option value="4">
          ⭐⭐⭐⭐ Boss
        </option>

      </select>

    </div>


    <div>

      <label>
        Quest-Typ
      </label>


      <select id="questType">

        <option value="normal">
          ⚔️ Quest
        </option>

        <option value="daily">
          🟢 Daily
        </option>

        <option value="side">
          🟣 Side Quest
        </option>

        <option value="boss">
          🐉 Boss Quest
        </option>

      </select>

    </div>

  </div>


  <button
    id="addQuestButton"
    class="primary"
  >

    ⚔️ QUEST ERSTELLEN

  </button>

</div>



<!-- =========================
     RANDOM QUEST
========================= -->

<div class="card">


  <h2>
    🎲 Zufällige Quest
  </h2>


  <p>

    Keine Lust zu entscheiden?
    Lass das Schicksal ran.

  </p>


  <div
    id="randomResult"
    class="random-result"
  >

    <span>
      ?
    </span>

  </div>


  <button
    id="randomButton"
    class="random-button"
  >

    🎲 RANDOM QUEST

  </button>


  <!--
       DIESER BUTTON IST
       VON ANFANG AN SICHTBAR
  -->

  <button
    id="acceptRandomButton"
    class="accept-random"
  >

    ⚔️ ALS QUEST ANNEHMEN

  </button>


  <button
    id="manageRandomButton"
    class="secondary"
  >

    ⚙️ Meine Random-Quests verwalten

  </button>


</div>



<!-- =========================
     AKTIVE QUESTS
========================= -->

<div>

  <h2>

    📜 Aktive Quests

    <span id="questCount">
      0
    </span>

  </h2>


  <div id="questList"></div>

</div>



<!-- =========================
     ACHIEVEMENTS
========================= -->

<div class="card">

  <h2>
    🏆 Deine Achievements
  </h2>


  <div id="achievements"></div>

</div>



<!-- =========================
     HISTORIE
========================= -->

<div class="card">

  <h2>
    📜 Quest-Historie
  </h2>


  <div id="history"></div>

</div>


</div>



<script>


/* =========================
   DATEN LADEN
========================= */

let data =
JSON.parse(
  localStorage.getItem(
    "questMode"
  )
) || {


  xp: 0,


  quests: [],


  history: [],


  randomQuests: [

    "10 Minuten spazieren gehen",

    "Eine Schublade aufräumen",

    "Ein Glas Wasser trinken",

    "5 Minuten dehnen",

    "Eine Sache erledigen, die ich seit Tagen aufschiebe"

  ],


  achievements: {}

};



/* =========================
   RANDOM QUEST
========================= */

let currentRandomQuest = null;



/* =========================
   ACHIEVEMENTS
========================= */

const achievements = [


  {

    id: "first",

    icon: "🌱",

    name: "Erste Schritte",

    description:
      "Schließe deine erste Quest ab.",

    check: () =>
      data.history.length >= 1

  },


  {

    id: "five",

    icon: "🔥",

    name: "Im Flow",

    description:
      "Schließe 5 Quests ab.",

    check: () =>
      data.history.length >= 5

  },


  {

    id: "ten",

    icon: "⚔️",

    name: "Quest Hunter",

    description:
      "Schließe 10 Quests ab.",

    check: () =>
      data.history.length >= 10

  },


  {

    id: "hundred",

    icon: "💯",

    name: "Hundert Punkte",

    description:
      "Sammle 100 XP.",

    check: () =>
      data.xp >= 100

  },


  {

    id: "fivehundred",

    icon: "👑",

    name: "Questmaster",

    description:
      "Sammle 500 XP.",

    check: () =>
      data.xp >= 500

  },


  {

    id: "boss",

    icon: "🐉",

    name: "Drachenbezwinger",

    description:
      "Schließe eine Boss Quest ab.",

    check: () =>
      data.history.some(
        q =>
          q.type === "boss"
      )

  }

];



/* =========================
   SPEICHERN
========================= */

function save() {

  localStorage.setItem(

    "questMode",

    JSON.stringify(data)

  );

}



/* =========================
   XP
========================= */

function getXP(
  difficulty
) {

  return {

    1: 10,

    2: 20,

    3: 35,

    4: 60

  }[difficulty];

}



/* =========================
   NORMALE QUEST ERSTELLEN
========================= */

function addQuest() {


  const input =
    document.getElementById(
      "questInput"
    );


  const text =
    input.value.trim();


  if (!text) {

    alert(
      "Du brauchst erst eine Quest 😄"
    );

    return;

  }


  const difficulty =
    Number(

      document
        .getElementById(
          "difficulty"
        )
        .value

    );


  const type =
    document
      .getElementById(
        "questType"
      )
      .value;


  data.quests.push({

    id: Date.now(),

    text: text,

    difficulty: difficulty,

    type: type,

    xp: getXP(
      difficulty
    ),

    created:
      new Date()
        .toLocaleString(
          "de-DE"
        )

  });


  input.value = "";


  save();

  render();

}



/* =========================
   RANDOM QUEST WÜRFELN
========================= */

function randomQuest() {


  if (
    data.randomQuests.length === 0
  ) {

    alert(
      "Du hast noch keine Random Quests!"
    );

    return;

  }


  const randomIndex =

    Math.floor(

      Math.random() *
      data.randomQuests.length

    );


  currentRandomQuest =

    data.randomQuests[
      randomIndex
    ];


  document.getElementById(
    "randomResult"
  ).innerHTML =

    "🎯 " +
    currentRandomQuest;

}



/* =========================
   RANDOM QUEST ANNEHMEN
========================= */

function acceptRandomQuest() {


  if (
    currentRandomQuest === null
  ) {

    alert(
      "Würfle zuerst eine Random Quest! 🎲"
    );

    return;

  }


  data.quests.push({

    id: Date.now(),

    text:
      currentRandomQuest,

    difficulty: 2,

    type: "side",

    xp: 20,

    created:
      new Date()
        .toLocaleString(
          "de-DE"
        )

  });


  currentRandomQuest = null;


  document.getElementById(
    "randomResult"
  ).innerHTML =

    "✅ Quest angenommen!";


  save();

  render();


}



/* =========================
   RANDOM QUESTS VERWALTEN
========================= */

function manageRandomQuests() {


  let list =
    "🎲 DEINE RANDOM QUESTS\n\n";


  if (
    data.randomQuests.length === 0
  ) {

    list +=
      "Noch keine Random Quests.\n";

  }


  data.randomQuests.forEach(

    function(
      quest,
      index
    ) {

      list +=

        (index + 1) +
        ". " +
        quest +
        "\n";

    }

  );


  const newQuest =

    prompt(

      list +

      "\n\nNeue Random Quest hinzufügen:"

    );


  if (
    newQuest &&
    newQuest.trim()
  ) {


    data.randomQuests.push(

      newQuest.trim()

    );


    save();


    alert(
      "🎲 Random Quest hinzugefügt!"
    );

  }

}



/* =========================
   QUEST ABSCHLIESSEN
========================= */

function completeQuest(
  id
) {


  const index =

    data.quests.findIndex(

      function(quest) {

        return quest.id === id;

      }

    );


  if (
    index === -1
  ) {

    return;

  }


  const quest =
    data.quests[index];


  data.xp += quest.xp;


  data.history.unshift({

    ...quest,

    completed:
      new Date()
        .toLocaleString(
          "de-DE"
        )

  });


  data.quests.splice(
    index,
    1
  );


  checkAchievements();


  save();

  render();


  alert(

    "🎉 QUEST ABGESCHLOSSEN!\n\n" +

    "+" +
    quest.xp +
    " XP"

  );

}



/* =========================
   QUEST LÖSCHEN
========================= */

function deleteQuest(
  id
) {


  data.quests =

    data.quests.filter(

      function(quest) {

        return quest.id !== id;

      }

    );


  save();

  render();

}



/* =========================
   ACHIEVEMENTS PRÜFEN
========================= */

function checkAchievements() {


  achievements.forEach(

    function(
      achievement
    ) {


      if (

        achievement.check() &&

        !data.achievements[
          achievement.id
        ]

      ) {


        data.achievements[
          achievement.id
        ] = true;


        setTimeout(

          function() {


            alert(

              "🏆 ACHIEVEMENT FREIGESCHALTET!\n\n" +

              achievement.name +

              "\n\n" +

              achievement.description

            );

          },

          100

        );

      }

    }

  );

}



/* =========================
   QUEST ICON
========================= */

function typeIcon(
  type
) {


  return {

    normal: "⚔️",

    daily: "🟢",

    side: "🟣",

    boss: "🐉"

  }[type] || "⚔️";

}



/* =========================
   QUESTS RENDERN
========================= */

function renderQuests() {


  const container =

    document.getElementById(
      "questList"
    );


  document.getElementById(
    "questCount"
  ).textContent =

    data.quests.length;


  if (
    data.quests.length === 0
  ) {


    container.innerHTML =

      `<div class="card">

        Keine offenen Quests 🎉

      </div>`;

    return;

  }


  container.innerHTML =


    data.quests.map(

      function(quest) {


        return `

          <div class="quest">


            <div class="quest-info">


              <div class="quest-name">

                ${typeIcon(
                  quest.type
                )}

                ${quest.text}

              </div>


              <div class="quest-meta">

                ${"⭐".repeat(
                  quest.difficulty
                )}

                ·

                +${quest.xp}

                XP

              </div>


            </div>


            <button
              class="complete"
              data-complete="${quest.id}"
            >

              ✓

            </button>


            <button
              class="delete"
              data-delete="${quest.id}"
            >

              🗑️

            </button>


          </div>

        `;

      }

    ).join("");

}



/* =========================
   ACHIEVEMENTS RENDERN
========================= */

function renderAchievements() {


  const container =

    document.getElementById(
      "achievements"
    );


  container.innerHTML =


    achievements.map(

      function(
        achievement
      ) {


        const unlocked =

          data.achievements[
            achievement.id
          ];


        return `

          <div class="achievement

            ${
              unlocked
                ? ""
                : "locked"
            }

          ">


            <div
              class="achievement-icon"
            >

              ${achievement.icon}

            </div>


            <div>


              <strong>

                ${achievement.name}

              </strong>


              <div class="quest-meta">

                ${achievement.description}

              </div>


            </div>


          </div>

        `;

      }

    ).join("");

}



/* =========================
   HISTORIE RENDERN
========================= */

function renderHistory() {


  const container =

    document.getElementById(
      "history"
    );


  if (
    data.history.length === 0
  ) {


    container.innerHTML =

      "<p>Noch keine abgeschlossenen Quests.</p>";

    return;

  }


  container.innerHTML =


    data.history

      .slice(0, 20)

      .map(

        function(quest) {


          return `

            <div class="history-item">

              ✓ ${quest.text}

              <strong>

                +${quest.xp} XP

              </strong>


              <br>


              <small>

                ${quest.completed}

              </small>


            </div>

          `;

        }

      )

      .join("");

}



/* =========================
   ALLES AKTUALISIEREN
========================= */

function render() {


  const level =

    Math.floor(
      data.xp / 100
    ) + 1;


  const xpIntoLevel =

    data.xp % 100;


  document.getElementById(
    "level"
  ).textContent =

    level;


  document.getElementById(
    "xp-current"
  ).textContent =

    xpIntoLevel;


  document.getElementById(
    "xp-needed"
  ).textContent =

    100;


  document.getElementById(
    "xp-fill"
  ).style.width =

    xpIntoLevel + "%";


  renderQuests();


  renderAchievements();


  renderHistory();

}



/* =========================
   BUTTON:
   QUEST ERSTELLEN
========================= */

document
  .getElementById(
    "addQuestButton"
  )
  .addEventListener(
    "click",
    addQuest
  );



/* =========================
   BUTTON:
   RANDOM QUEST
========================= */

document
  .getElementById(
    "randomButton"
  )
  .addEventListener(
    "click",
    randomQuest
  );



/* =========================
   BUTTON:
   RANDOM QUEST ANNEHMEN
========================= */

document
  .getElementById(
    "acceptRandomButton"
  )
  .addEventListener(
    "click",
    acceptRandomQuest
  );



/* =========================
   BUTTON:
   RANDOM QUEST VERWALTEN
========================= */

document
  .getElementById(
    "manageRandomButton"
  )
  .addEventListener(
    "click",
    manageRandomQuests
  );



/* =========================
   QUEST-LISTE:
   ERLEDIGEN / LÖSCHEN
========================= */

document
  .getElementById(
    "questList"
  )
  .addEventListener(

    "click",

    function(event) {


      const completeButton =

        event.target.closest(
          "[data-complete]"
        );


      if (
        completeButton
      ) {


        completeQuest(

          Number(
            completeButton
              .dataset
              .complete
          )

        );


        return;

      }


      const deleteButton =

        event.target.closest(
          "[data-delete]"
        );


      if (
        deleteButton
      ) {


        deleteQuest(

          Number(
            deleteButton
              .dataset
              .delete
          )

        );

      }

    }

  );



/* =========================
   APP STARTEN
========================= */

render();


</script>

</body>

</html>
